  <style>
    body {
      font-family: Sora, ui-sans-serif, system-ui;
      background:
        radial-gradient(circle at 20% 20%, rgba(34,197,94,0.2), transparent 35%),
        radial-gradient(circle at 80% 0%, rgba(16,185,129,0.16), transparent 32%),
        linear-gradient(160deg, #020617 0%, #020b1c 50%, #020617 100%);
    }
    .code-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
    .code-scroll::-webkit-scrollbar-track { background: #0b1327; border-radius: 999px; }
    .code-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 999px; }
    pre[class*="language-"] { margin: 0; background: transparent; border: 0; padding: 0; text-shadow: none; }
    code[class*="language-"] {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px; line-height: 21px; text-shadow: none;
    }
    #source-code-view { display: block; padding: 6px; }
    .source-file-tab { border: 1px solid #334155; background: rgba(15, 23, 42, 0.8); color: #cbd5e1; }
    .source-file-tab.active { border-color: rgba(52, 211, 153, 0.7); background: rgba(16, 185, 129, 0.2); color: #a7f3d0; }
    .source-hidden { display: none; }
    @media (min-width: 1024px) { .source-hidden { display: block; } }
    .status-ok { color: #86efac; }
    .status-err { color: #fecaca; }
  </style>
</head>

      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>

    </button>

    <a href="../docs.html" class="block rounded-md px-3 py-2 text-sm font-medium text-slate-300 hover:text-emerald-300 hover:bg-slate-800/50">Docs</a>

  <main class="mx-auto min-h-[calc(100dvh-130px)] w-full max-w-7xl px-5 py-8 lg:py-10">
    <div class="mb-4 flex rounded-xl border border-slate-700 bg-slate-900/80 p-1 lg:hidden" role="tablist" aria-label="Playground view mode">
      <button id="app-tab" type="button" role="tab" aria-controls="app-panel" aria-selected="true" class="min-h-[44px] flex-1 rounded-lg bg-emerald-400 px-3 py-2 text-sm font-semibold text-emerald-950">App</button>
      <button id="source-tab" type="button" role="tab" aria-controls="source-panel" aria-selected="false" class="min-h-[44px] flex-1 rounded-lg px-3 py-2 text-sm font-semibold text-slate-300">Test Source</button>
    </div>

    <div class="grid grid-cols-1 gap-5 lg:grid-cols-2 lg:gap-6 lg:items-start">
      <section id="app-panel" role="tabpanel" aria-labelledby="app-tab" class="rounded-3xl border border-emerald-500/25 bg-slate-900/70 p-7 backdrop-blur">
        <div class="mb-5">
          <h1 class="text-3xl font-bold tracking-tight text-white">Network Requests</h1>
          <p class="mt-2 text-sm text-slate-300">Each button calls the public JSONPlaceholder API. Run the tests to capture and assert these requests.</p>
        </div>

        <div class="space-y-3">
          <button type="button" id="load-posts-btn" class="w-full rounded-xl bg-emerald-400 px-4 py-2.5 text-sm font-bold text-emerald-950 transition hover:bg-emerald-300">GET /posts?userId=1</button>
          <button type="button" id="get-post-btn" class="w-full rounded-xl bg-slate-700 px-4 py-2.5 text-sm font-bold text-slate-100 transition hover:bg-slate-600">GET /posts/1</button>
          <button type="button" id="create-post-btn" class="w-full rounded-xl bg-slate-700 px-4 py-2.5 text-sm font-bold text-slate-100 transition hover:bg-slate-600">POST /posts</button>
        </div>

        <div class="mt-5 rounded-xl border border-slate-700 bg-slate-950/70 p-4">
          <div class="mb-2 flex items-center gap-2 text-sm">
            <span class="text-slate-400">Status:</span>
            <span id="status" class="font-semibold text-slate-300">idle</span>
          </div>
          <pre class="code-scroll max-h-64 overflow-auto text-xs text-slate-200"><code id="result">No request made yet.</code></pre>
        </div>
      </section>

      <section id="source-panel" role="tabpanel" aria-labelledby="source-tab" class="source-hidden rounded-3xl border border-slate-700/80 bg-slate-900/70 backdrop-blur">
        <div class="flex items-center justify-between border-b border-slate-700/80 px-4 py-3">
          <h2 class="text-sm font-semibold tracking-wide text-emerald-300">Test Source</h2>
          <div class="flex items-center gap-2">
            <span id="source-file-badge" class="rounded-md border border-slate-600 px-2 py-1 text-xs text-slate-300">network.test.ts</span>
            <button id="source-copy-btn" type="button" class="min-h-[32px] rounded-md border border-slate-600 px-2.5 py-1 text-xs font-medium text-slate-200 transition hover:border-emerald-400/70 hover:text-emerald-200">Copy</button>
          </div>
        </div>
        <div class="border-b border-slate-700/80 px-2 py-2">
          <div id="source-file-tabs" class="flex min-h-[44px] items-center gap-2 overflow-x-auto">
            <button type="button" data-file="test" class="source-file-tab active rounded-md px-3 py-2 text-xs font-medium">network.test.ts</button>
            <button type="button" data-file="pom" class="source-file-tab rounded-md px-3 py-2 text-xs font-medium">pom/network.pom.ts</button>
          </div>
        </div>
        <pre class="code-scroll overflow-x-auto p-4 text-slate-200"><code id="source-code-view" class="language-typescript"></code></pre>
      </section>
    </div>
  </main>

  <script>
    (function() {
      var API = 'https://jsonplaceholder.typicode.com';
      var statusEl = document.getElementById('status');
      var resultEl = document.getElementById('result');

      function setStatus(code, ok) {
        statusEl.textContent = String(code);
        statusEl.className = 'font-semibold ' + (ok ? 'status-ok' : 'status-err');
      }
      function showResult(data) {
        resultEl.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
      }
      function run(promise) {
        setStatus('loading...', true);
        promise.then(function(res) {
          setStatus(res.status, res.ok);
          return res.json();
        }).then(showResult).catch(function(err) {
          setStatus('error', false);
          showResult(String(err));
        });
      }

      document.getElementById('load-posts-btn').addEventListener('click', function() {
        run(fetch(API + '/posts?userId=1'));
      });
      document.getElementById('get-post-btn').addEventListener('click', function() {
        run(fetch(API + '/posts/1'));
      });
      document.getElementById('create-post-btn').addEventListener('click', function() {
        run(fetch(API + '/posts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: 'Tomation', body: 'Captured by AssertRequest', userId: 1 })
        }));
      });
    })();
  </script>

  <script>
    (function() {
      var appTab = document.getElementById('app-tab');
      var sourceTab = document.getElementById('source-tab');
      var appPanel = document.getElementById('app-panel');
      var sourcePanel = document.getElementById('source-panel');
      if (!appTab || !sourceTab || !appPanel || !sourcePanel) return;
      function setView(view) {
        var isApp = view === 'app';
        appTab.setAttribute('aria-selected', isApp ? 'true' : 'false');
        sourceTab.setAttribute('aria-selected', isApp ? 'false' : 'true');
        appTab.className = isApp
          ? 'min-h-[44px] flex-1 rounded-lg bg-emerald-400 px-3 py-2 text-sm font-semibold text-emerald-950'
          : 'min-h-[44px] flex-1 rounded-lg px-3 py-2 text-sm font-semibold text-slate-300';
        sourceTab.className = isApp
          ? 'min-h-[44px] flex-1 rounded-lg px-3 py-2 text-sm font-semibold text-slate-300'
          : 'min-h-[44px] flex-1 rounded-lg bg-emerald-400 px-3 py-2 text-sm font-semibold text-emerald-950';
        if (window.matchMedia('(min-width: 1024px)').matches) {
          appPanel.style.display = 'block';
          sourcePanel.style.display = 'block';
          return;
        }
        appPanel.style.display = isApp ? 'block' : 'none';
        sourcePanel.style.display = isApp ? 'none' : 'block';
      }
      appTab.addEventListener('click', function() { setView('app'); });
      sourceTab.addEventListener('click', function() { setView('source'); });
      window.addEventListener('resize', function() {
        setView(appTab.getAttribute('aria-selected') === 'true' ? 'app' : 'source');
      });
      setView('app');
    })();
  </script>

  <script>
    (function() {
      var NL = '\n';
      var testCode = [
        "import { Test, Navigate, Wait, AssertHasText } from '@tomationjs/dsl'",
        "import Network from '~/pom/network.pom'",
        "",
        "Test('GET request with query params is captured', () => {",
        "  Navigate('network/index.html')",
        "  Wait(300)",
        "  Network.loadPosts()",
        "  Wait(800)",
        "  AssertHasText(Network.status, '200')",
        "  Network.assertPostsListRequest()",
        "})",
        "",
        "Test('POST request body and 201 status are captured', () => {",
        "  Navigate('network/index.html')",
        "  Wait(300)",
        "  Network.createPost()",
        "  Wait(800)",
        "  AssertHasText(Network.status, '201')",
        "  Network.assertCreatePostRequest()",
        "  Network.assertCreateCalledOnce()",
        "})"
      ].join(NL);

      var pomCode = [
        "import { is, idIs, Task, Click, AssertRequest } from '@tomationjs/dsl'",
        "",
        "const API = 'https://jsonplaceholder.typicode.com'",
        "",
        "const loadPostsButton = is.BUTTON.where(idIs('load-posts-btn')).as('Load Posts')",
        "const createPostButton = is.BUTTON.where(idIs('create-post-btn')).as('Create Post')",
        "",
        "const loadPosts = Task(() => { Click(loadPostsButton) }).as('Load Posts')",
        "const createPost = Task(() => { Click(createPostButton) }).as('Create a Post')",
        "",
        "// GET /posts?userId=1 - method + query subset + 200",
        "const assertPostsListRequest = Task(() => {",
        "  AssertRequest(API + '/posts').method('GET').query({ userId: '1' }).status(200)",
        "}).as('Assert GET /posts?userId=1')",
        "",
        "// POST /posts - method + JSON body subset + 201 Created",
        "const assertCreatePostRequest = Task(() => {",
        "  AssertRequest(API + '/posts').method('POST').jsonBody({ title: 'Tomation', userId: 1 }).status(201)",
        "}).as('Assert POST /posts')",
        "",
        "export default { loadPosts, createPost, assertPostsListRequest, assertCreatePostRequest }"
      ].join(NL);

      var sourceFiles = {
        test: { name: 'network.test.ts', code: testCode },
        pom: { name: 'pom/network.pom.ts', code: pomCode }
      };

      var tabContainer = document.getElementById('source-file-tabs');
      var codeView = document.getElementById('source-code-view');
      var badge = document.getElementById('source-file-badge');
      var copyBtn = document.getElementById('source-copy-btn');
      var activeFileKey = 'test';
      if (!tabContainer || !codeView || !badge) return;

      function setSourceFile(fileKey) {
        var file = sourceFiles[fileKey];
        if (!file) return;
        activeFileKey = fileKey;
        badge.textContent = file.name;
        codeView.textContent = file.code;
        var buttons = tabContainer.querySelectorAll('button[data-file]');
        for (var i = 0; i < buttons.length; i += 1) {
          buttons[i].classList.toggle('active', buttons[i].getAttribute('data-file') === fileKey);
        }
        if (window.Prism && typeof window.Prism.highlightElement === 'function') {
          window.Prism.highlightElement(codeView);
        }
      }

      tabContainer.addEventListener('click', function(event) {
        var btn = event.target.closest('button[data-file]');
        if (!btn) return;
        setSourceFile(btn.getAttribute('data-file'));
      });

      if (copyBtn) {
        copyBtn.addEventListener('click', function() {
          var current = sourceFiles[activeFileKey];
          if (!current) return;
          function onCopyDone() {
            var originalLabel = copyBtn.textContent;
            copyBtn.textContent = 'Copied';
            setTimeout(function() { copyBtn.textContent = originalLabel; }, 1200);
          }
          if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
            navigator.clipboard.writeText(current.code).then(onCopyDone).catch(function() {});
            return;
          }
          var textArea = document.createElement('textarea');
          textArea.value = current.code;
          document.body.appendChild(textArea);
          textArea.select();
          try { document.execCommand('copy'); onCopyDone(); } catch (error) {}
          document.body.removeChild(textArea);
        });
      }

      setSourceFile('test');
      window.addEventListener('load', function() { setSourceFile(activeFileKey); });
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js"></script>
  <script>
    (function() {
      var btn = document.getElementById('nav-menu-btn');
      var menu = document.getElementById('nav-mobile-menu');
      if (!btn || !menu) return;
      btn.addEventListener('click', function() {
        var isOpen = !menu.classList.contains('hidden');
        menu.classList.toggle('hidden');
        btn.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
      });
    })();
  </script>
