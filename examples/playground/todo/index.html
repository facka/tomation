      border-color: rgba(52, 211, 153, 0.7);

      color: #a7f3d0;
    }

    .source-hidden {
      display: none;
    }

      .source-hidden {

  <main class="mx-auto min-h-[calc(100dvh-130px)] w-full max-w-7xl px-5 py-8 lg:py-10">

      <button id="app-tab" type="button" role="tab" aria-controls="app-panel" aria-selected="true" class="min-h-[44px] flex-1 rounded-lg bg-emerald-400 px-3 py-2 text-sm font-semibold text-emerald-950">App</button>
      <button id="source-tab" type="button" role="tab" aria-controls="source-panel" aria-selected="false" class="min-h-[44px] flex-1 rounded-lg px-3 py-2 text-sm font-semibold text-slate-300">Test Source</button>
    </div>

    <div class="grid grid-cols-1 gap-5 lg:grid-cols-2 lg:gap-6 lg:items-start">
      <section id="app-panel" role="tabpanel" aria-labelledby="app-tab" class="rounded-3xl border border-emerald-500/25 bg-slate-900/70 p-7 shadow-[0_0_0_1px_rgba(34,197,94,0.18),0_20px_80px_rgba(2,6,23,0.7)] backdrop-blur">
        <h1 class="mb-5 text-3xl font-bold tracking-tight text-white">Todo List</h1>
        <div class="add-form mb-6 flex gap-2">
          <input type="text" id="todo-input" placeholder="Enter a task..." class="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-slate-100 placeholder:text-slate-500 focus:border-emerald-400 focus:outline-none">
          <button id="add-btn" class="rounded-xl bg-emerald-400 px-4 py-2.5 text-sm font-bold text-emerald-950 transition hover:bg-emerald-300">Add</button>
        </div>
        <ul id="todo-list" class="space-y-2"></ul>
      </section>

      <section id="source-panel" role="tabpanel" aria-labelledby="source-tab" class="source-hidden rounded-3xl border border-slate-700/80 bg-slate-900/70 shadow-[0_0_0_1px_rgba(34,197,94,0.12),0_20px_80px_rgba(2,6,23,0.65)] backdrop-blur">
        <div class="flex items-center justify-between border-b border-slate-700/80 px-4 py-3">
          <h2 class="text-sm font-semibold tracking-wide text-emerald-300">Test Source</h2>
          <div class="flex items-center gap-2">
            <span id="source-file-badge" class="rounded-md border border-slate-600 px-2 py-1 text-xs text-slate-300">todo.test.ts</span>
            <button id="source-copy-btn" type="button" class="min-h-[32px] rounded-md border border-slate-600 px-2.5 py-1 text-xs font-medium text-slate-200 transition hover:border-emerald-400/70 hover:text-emerald-200">Copy</button>
          </div>
        </div>
        <div class="border-b border-slate-700/80 px-2 py-2">
          <div id="source-file-tabs" class="flex min-h-[44px] items-center gap-2 overflow-x-auto">
            <button type="button" data-file="test" class="source-file-tab active rounded-md px-3 py-2 text-xs font-medium">todo.test.ts</button>
            <button type="button" data-file="pom" class="source-file-tab rounded-md px-3 py-2 text-xs font-medium">pom/todo.pom.ts</button>
          </div>

  <script>
    (function() {
      var input = document.getElementById('todo-input');
      var addBtn = document.getElementById('add-btn');
      var list = document.getElementById('todo-list');

      function addTodo() {
        var text = input.value.trim();
        if (!text) return;

        var li = document.createElement('li');
        li.className = 'todo-item flex items-center justify-between rounded-xl border border-slate-700 bg-slate-950 px-3 py-2';

        var span = document.createElement('span');
        span.className = 'todo-text flex-1 text-sm text-slate-100';
        span.textContent = text;

        var del = document.createElement('button');
        del.className = 'delete-btn ml-3 rounded-lg border border-rose-500/40 bg-rose-500/15 px-3 py-1 text-xs font-semibold text-rose-200 transition hover:bg-rose-500/25';
        del.textContent = 'Delete';
        del.addEventListener('click', function() {
          list.removeChild(li);
        });

        li.appendChild(span);
        li.appendChild(del);
        list.appendChild(li);

        input.value = '';
      }

      addBtn.addEventListener('click', addTodo);
      input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') addTodo();
      });
    })();
  </script>
  <script>
    (function() {
      var appTab = document.getElementById('app-tab');
      var sourceTab = document.getElementById('source-tab');
      var appPanel = document.getElementById('app-panel');
      var sourcePanel = document.getElementById('source-panel');

      if (!appTab || !sourceTab || !appPanel || !sourcePanel) return;

      function setView(view) {
        var isApp = view === 'app';

        appTab.setAttribute('aria-selected', isApp ? 'true' : 'false');
        sourceTab.setAttribute('aria-selected', isApp ? 'false' : 'true');

        appTab.className = isApp
          ? 'min-h-[44px] flex-1 rounded-lg bg-emerald-400 px-3 py-2 text-sm font-semibold text-emerald-950'
          : 'min-h-[44px] flex-1 rounded-lg px-3 py-2 text-sm font-semibold text-slate-300';
        sourceTab.className = isApp
          ? 'min-h-[44px] flex-1 rounded-lg px-3 py-2 text-sm font-semibold text-slate-300'
          : 'min-h-[44px] flex-1 rounded-lg bg-emerald-400 px-3 py-2 text-sm font-semibold text-emerald-950';

        if (window.matchMedia('(min-width: 1024px)').matches) {
          appPanel.style.display = 'block';
          sourcePanel.style.display = 'block';
          return;
        }

        appPanel.style.display = isApp ? 'block' : 'none';
        sourcePanel.style.display = isApp ? 'none' : 'block';
      }

      appTab.addEventListener('click', function() { setView('app'); });
      sourceTab.addEventListener('click', function() { setView('source'); });
      window.addEventListener('resize', function() {
        setView(appTab.getAttribute('aria-selected') === 'true' ? 'app' : 'source');
      });

      setView('app');
    })();
  </script>
  <script>
    (function() {
      var sourceFiles = {
        test: {
          name: 'todo.test.ts',
          code: `import { Test, Click, Type, AssertExists, AssertNotExists, AssertHasText } from '@tomationjs/dsl'
import Todo from '~/pom/todo.pom'

Test('Add a todo item and verify it exists', () => {
  Todo.addItem({ text: 'Buy groceries' })
  AssertExists(Todo.firstItem)
  AssertHasText(Todo.firstItemText, 'Buy groceries')
})

Test('Delete a todo item and verify it is removed', () => {
  Type('Walk the dog').in(Todo.input)
  Click(Todo.addButton)
  AssertExists(Todo.firstItem)
  Click(Todo.deleteButton)
  AssertNotExists(Todo.firstItem)
})

Test('Add multiple items and verify text content', () => {
  Todo.addItem({ text: 'Read a book' })
  Todo.addItem({ text: 'Write code' })
  AssertExists(Todo.firstItem)
  AssertHasText(Todo.list, 'Read a book')
  AssertHasText(Todo.list, 'Write code')
})`
        },
        pom: {
          name: 'pom/todo.pom.ts',
          code: `import { is, idIs, classIncludes, Task, Type, Click } from '@tomationjs/dsl'

const input = is.INPUT.where(idIs('todo-input')).as('Todo Input')
const addButton = is.BUTTON.where(idIs('add-btn')).as('Add Button')
const list = is.UL.where(idIs('todo-list')).as('Todo List')
const firstItem = is.LI.where(classIncludes('todo-item')).as('First Item')
const firstItemText = is.SPAN.where(classIncludes('todo-text')).as('Item Text')
const deleteButton = is.BUTTON.where(classIncludes('delete-btn')).as('Delete Button')

const addItem = Task((params: { text: string }) => {
  const { text } = params
  Type(text).in(input)
  Click(addButton)
}).as('Add Item')

export default { input, addButton, list, firstItem, firstItemText, deleteButton, addItem }`
        }
      };

      var tabContainer = document.getElementById('source-file-tabs');
      var codeView = document.getElementById('source-code-view');
      var badge = document.getElementById('source-file-badge');
      var copyBtn = document.getElementById('source-copy-btn');
      var activeFileKey = 'test';
      if (!tabContainer || !codeView || !badge) return;

      function setSourceFile(fileKey) {
        var file = sourceFiles[fileKey];
        if (!file) return;
        activeFileKey = fileKey;

        badge.textContent = file.name;
        codeView.textContent = file.code;

        var buttons = tabContainer.querySelectorAll('button[data-file]');
        for (var i = 0; i < buttons.length; i += 1) {
          var isActive = buttons[i].getAttribute('data-file') === fileKey;
          buttons[i].classList.toggle('active', isActive);
        }

        if (window.Prism && typeof window.Prism.highlightElement === 'function') {
          window.Prism.highlightElement(codeView);
        }
      }

      tabContainer.addEventListener('click', function(event) {
        var btn = event.target.closest('button[data-file]');
        if (!btn) return;
        setSourceFile(btn.getAttribute('data-file'));
      });

      if (copyBtn) {
        copyBtn.addEventListener('click', function() {
          var current = sourceFiles[activeFileKey];
          if (!current) return;

          function onCopyDone() {
            var originalLabel = copyBtn.textContent;
            copyBtn.textContent = 'Copied';
            setTimeout(function() {
              copyBtn.textContent = originalLabel;
            }, 1200);
          }

          if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
            navigator.clipboard.writeText(current.code).then(onCopyDone).catch(function() {});
            return;
          }

          var textArea = document.createElement('textarea');
          textArea.value = current.code;
          document.body.appendChild(textArea);
          textArea.select();
          try {
            document.execCommand('copy');
            onCopyDone();
          } catch (error) {
            // Ignore clipboard fallback errors.
          }
          document.body.removeChild(textArea);
        });
      }

      setSourceFile('test');
      window.addEventListener('load', function() {
        setSourceFile(activeFileKey);
      });
    })();
  </script>

  <script>

    (function() {
      var btn = document.getElementById('nav-menu-btn');
      var menu = document.getElementById('nav-mobile-menu');
      if (!btn || !menu) return;
      btn.addEventListener('click', function() {
        var isOpen = !menu.classList.contains('hidden');
        menu.classList.toggle('hidden');
        btn.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
      });
    })();
  </script>
